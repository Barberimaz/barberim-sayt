<style>
:root{
  --ink:#0d1830; --ink2:#14234a; --line:#2a3d69; --paper:#f4f7ff; --mute:#9fb0d3;
  --pri:#e5384d; --sun:#ffc107; --sky:#4da3ff;
  --display:'Bricolage Grotesque',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--ink);color:var(--paper);font:400 1.05rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;max-width:18ch}
section{padding:84px 0}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(13,24,48,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font:800 1.35rem var(--display);text-decoration:none}
nav{display:flex;gap:22px;align-items:center}
nav a{text-decoration:none;color:var(--mute);font-weight:500}
nav a:hover{color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sun);color:#0d1830;font-weight:700;text-decoration:none;padding:13px 22px;border-radius:10px;border:0;cursor:pointer;font-size:1rem;font-family:inherit}
.btn:hover{filter:brightness(1.07)}
.btn.sm{padding:9px 16px}
@media(max-width:720px){nav a:not(.btn){display:none}}

/* hero */
.hero{padding:72px 0 88px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
h1{font-size:clamp(2.5rem,7vw,4.6rem);font-weight:800;max-width:11ch}
.lead{margin:22px 0 30px;color:var(--mute);max-width:46ch;font-size:1.15rem}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn.ghost{background:transparent;color:var(--paper);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--paper)}

.phone{position:relative;background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px 22px 22px 40px;overflow:hidden}
.pole{position:absolute;left:0;top:0;bottom:0;width:18px;
  background:repeating-linear-gradient(135deg,var(--pri) 0 14px,var(--paper) 14px 28px,var(--sky) 28px 42px,var(--paper) 42px 56px);
  background-size:80px 80px;animation:spin 3s linear infinite}
@keyframes spin{to{background-position:0 80px}}
.phone small{display:block;color:var(--mute);font-size:.8rem;margin-bottom:14px}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-family:var(--display);font-size:1.15rem}
.row span{color:var(--mute);font-size:.9rem;margin-left:6px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:.9rem;font-weight:500}
.chip.on{background:var(--sun);color:#0d1830;border-color:var(--sun);font-weight:700}
.chip.off{color:#5f7099;text-decoration:line-through}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}

/* features */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:44px}
.split h3{font-size:1.5rem;margin-bottom:6px}
.split p.sub{color:var(--mute);margin-bottom:10px}
.list{list-style:none;padding:0}
.list li{padding:15px 0;border-top:1px solid var(--line)}
.list strong{display:block;font-weight:700}
.list span{color:var(--mute);font-size:.98rem}
@media(max-width:760px){.split{grid-template-columns:1fr;gap:40px}}

/* steps */
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--pri);padding-top:16px}
.steps li::before{content:counter(s);font:800 2.2rem var(--display);color:var(--pri)}
.steps h3{font-size:1.25rem;margin:4px 0 6px}
.steps p{color:var(--mute);font-size:.98rem}
@media(max-width:760px){.steps{grid-template-columns:1fr}}

/* download band */
.dl{background:var(--pri);color:#fff}
.dl h2{max-width:20ch}
.dl p.lead{color:#ffe6e9}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;max-width:720px}
.store{display:block;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:14px;padding:18px 22px}
.store small{display:block;color:var(--mute);font-size:.82rem}
.store strong{font:800 1.3rem var(--display)}
.store[aria-disabled="true"]{background:rgba(13,24,48,.35);color:#ffd9dc;pointer-events:none}
.store[aria-disabled="true"] small{color:#ffd9dc}
details{margin-top:18px;max-width:720px}
summary{cursor:pointer;font-weight:700}
details ol{margin:10px 0 0 20px}
@media(max-width:620px){.stores{grid-template-columns:1fr}}

/* contact */
.contact .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
.links{list-style:none;padding:0;margin-top:26px}
.links li{border-top:1px solid var(--line)}
.links a{display:block;padding:15px 0;text-decoration:none}
.links small{display:block;color:var(--mute)}
.links strong{font-weight:700}
.links a:hover strong{color:var(--sun)}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,textarea{font:inherit;color:var(--paper);background:var(--ink2);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
input:focus,textarea:focus{outline:0;border-color:var(--sun)}
textarea{min-height:130px;resize:vertical}
.hp{position:absolute;left:-9999px}
#status{min-height:1.5em;font-weight:600}
#status.ok{color:#8fd694}
#status.err{color:#ff8b7a}
@media(max-width:820px){.contact .wrap{grid-template-columns:1fr;gap:36px}}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.book{margin-top:14px;background:var(--sun);color:#0d1830;font-weight:700;text-align:center;border-radius:10px;padding:12px;font-size:.95rem}
.join{padding:0 0 84px}
.join .box{border:1.5px solid var(--line);border-radius:18px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.faq details{margin:0;max-width:none;border-top:1px solid var(--line);padding:18px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-weight:700;font-size:1.08rem}
.faq details p{color:var(--mute);margin-top:8px;max-width:62ch}
footer a{color:var(--mute)}
footer a:hover{color:var(--paper)}
/* animasiyalar */
@keyframes up{to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes mq{to{transform:translateX(-50%)}}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
h1 .w>span{display:inline-block;transform:translateY(110%);animation:up .75s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 150ms)}
.hero .lead{animation:rise .8s .75s both}
.hero .cta{animation:rise .8s .95s both}
.phone{animation:float 6s ease-in-out infinite}
.chip{transition:background .25s,color .25s,border-color .25s}
.chip.on{animation:pop .4s}
.book{transition:background .3s,color .3s}
.book.ok{background:var(--sky);color:var(--ink)}
.btn{transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px)}
.store{transition:transform .25s}
.store:hover{transform:translateY(-4px) rotate(-1deg)}
.dl :focus-visible{outline-color:#fff}
.marquee{border-block:1px solid var(--line);background:var(--ink2);overflow:hidden}
.track{display:flex;width:max-content;padding:16px 0;animation:mq 30s linear infinite}
.track span{font:800 1.5rem var(--display);white-space:nowrap}
.track span::after{content:"✂";margin:0 36px;color:var(--pri);display:inline-block}
